# One-command local run:  cp .env.example .env  (fill it in)  &&  docker compose up --build
# Then open http://localhost:3000
#
# Ports are bound to 127.0.0.1 so the app is reachable only from this machine.
# The API has no authentication — see docs/deployment.md before exposing it.

services:
  api:
    build: .
    env_file:
      - .env
    environment:
      # Overrides any relative LOG_DIR in .env; this path is writable by the
      # container's non-root user.
      LOG_DIR: /app/logs
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - api_logs:/app/logs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api_logs:
