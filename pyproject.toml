[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-tokenizer"
version = "1.1.0"
description = "Security-first PII detection, tokenization, validation, and LLM-safe document processing."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "PII Tokenizer Contributors"}]
keywords = ["pii", "privacy", "security", "tokenization", "presidio", "aws", "llm", "fastapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.20,<1",
  "boto3>=1.35,<2",
  "anthropic>=0.40,<1",
  "presidio-analyzer>=2.2.355,<3",
  "presidio-anonymizer>=2.2.355,<3",
  "spacy>=3.8,<4",
  "pdfplumber>=0.11,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "httpx>=0.28,<1",
  "build>=1.2,<2",
]

[project.scripts]
pii-tokenizer = "pii_tokenizer.main:run"

[project.urls]
Homepage = "https://github.com/nitinadmin/pii-tokenizer-public"
Repository = "https://github.com/nitinadmin/pii-tokenizer-public"
Issues = "https://github.com/nitinadmin/pii-tokenizer-public/issues"
Security = "https://github.com/nitinadmin/pii-tokenizer-public/security/policy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["frontend"]

[tool.ruff.lint]
# Explicit rule set: the dev dependency allows any ruff <1, and newer ruff
# releases enable more rules by default, which made CI lint fail.
select = ["E", "F", "I", "B"]
# FastAPI's `File(...)` defaults are the framework's idiom; long regex and log
# lines predate this config and are left to a formatter pass.
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pii_tokenizer"]
